# BBDM 96-channel scribble illust config for TVCG 2026 major revision
# Derived from BBDM_region_large_cvprw/configs/scribble_proposed_illust_200epoch.yaml
# (the 96-channel variant that produced generated_images/BBDM_channel_96/).
# Adds scratch_root for the migrated tvcg26_major_revision data layout.
runner: "BBDMRunner"
start_epoch: 0
training:
  n_epochs: 200
  n_steps: 400000
  save_interval: 10
  sample_interval: 1
  validation_interval: 1000
  accumulate_grad_batches: 4

testing:
  clip_denoised: True
  sample_num: 1

data:
  dataset_name: 'dataset_name'
  dataset_type: 'custom_train_our_model'
  dataset_config:
    dataset_path: '/scratch/madono/tvcg26_major_revision'
    # scratch_root disabled for eval - using test_paper.txt driven set
    hint_type: 'scribble'
    domain: "illust"
    image_size: 256
    channels: 3
  train:
    batch_size: 1
    shuffle: True
  val:
    batch_size: 1
    shuffle: True
  test:
    batch_size: 2

model:
  model_name: "BrownianBridge_scribble_illust"
  model_type: "BBDM"
  latent_before_quant_conv: False
  normalize_latent: False
  only_load_latent_mean_std: False

  EMA:
    use_ema: True
    ema_decay: 0.995
    update_ema_interval: 8
    start_ema_step: 30000

  CondStageParams:
    n_stages: 2
    in_channels: 5
    out_channels: 5

  BB:
    optimizer:
      weight_decay: 0.000
      optimizer: 'Adam'
      lr: 1.e-4
      beta1: 0.9

    lr_scheduler:
      factor: 0.5
      patience: 3000
      threshold: 0.0001
      cooldown: 3000
      min_lr: 5.e-7

    params:
      mt_type: 'linear'
      objective: 'grad'
      loss_type: 'l1'

      skip_sample: True
      sample_type: 'linear'
      sample_step: 200

      num_timesteps: 1000
      eta: 1.0
      max_var: 1.0

      UNetParams:
        image_size: 256
        in_channels: 10
        model_channels: 96
        out_channels: 5
        num_res_blocks: 2
        attention_resolutions: !!python/tuple
          - 32
          - 16
          - 8
        channel_mult: !!python/tuple
          - 1
          - 4
          - 8
        conv_resample: True
        dims: 2
        num_heads: 8
        num_head_channels: 64
        use_scale_shift_norm: True
        resblock_updown: True
        use_spatial_transformer: False
        context_dim:
        condition_key: "SpatialRescaler"
