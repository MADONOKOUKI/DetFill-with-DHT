# DetFill inference / evaluation environment (import-verified).
#
# Exported from the conda env (`BBDM`) that produced the paper's DetFill scribble results
# (Tables II-III and the supplementary alpha-grid / segmenter / seed analyses). The versions
# below are the ones actually imported at runtime (`python -c "import numpy; print(numpy.__version__)"`
# etc.), NOT a raw `conda env export`: that env carries stale duplicate pip metadata (e.g. a
# numpy 1.26.4 dist-info next to the active numpy 2.0.2), so a raw export would be wrong.
# Runtime: Python 3.9.16, CUDA 12.4, cuDNN 9.1.0.
#
# Note on region-selection ties: the order of equal-area regions in `np.argsort(-count)`
# (datasets/custom.py) depends on the NumPy build; the paper's numbers correspond to numpy==2.0.2.
name: BBDM
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.9.16
  - pip
  - pip:
      - numpy==2.0.2
      - torch==2.5.1
      - torchvision==0.20.1
      - opencv-python==4.11.0.86
      - scikit-image==0.24.0
      - scipy==1.13.1
      - pillow==10.4.0
      - lpips==0.1.4
      - open_clip_torch==2.26.1
      - dreamsim==0.2.0
      - transformers==4.57.1
      - torchmetrics==1.4.0.post0
      - einops==0.4.1
      - omegaconf==2.3.0
      - pyyaml==6.0.2
      - tqdm==4.66.4
      - pytorch-lightning==1.9.3   # imported at module level by model/VQGAN (not used by DetFill)
      - tensorboard
      - torchsummary
      # NOTE: this is the inference environment. Deterministic hint generation (FilFinder) is NOT
      # runnable here: astropy releases compatible with numpy 2 need Python >= 3.10. Use
      # replicability/environment.yml (Python 3.9, numpy 1.26.4, astropy 5.3.4, fil_finder 1.7.2) or
      # hint_generation/requirements.txt (the original numpy 1.x era pins) for hint generation.
