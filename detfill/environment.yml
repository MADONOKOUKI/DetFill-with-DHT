# DetFill inference / evaluation environment (import-verified 2026-09-18).
#
# Exported from the conda env (`BBDM`) that produced the paper's DetFill scribble results
# (Tables II-III and the supplementary alpha-grid / segmenter / seed analyses). The versions
# below are the ones actually imported at runtime (`python -c "import numpy; print(numpy.__version__)"`
# etc.), NOT a raw `conda env export`: that env carries stale duplicate pip metadata (e.g. a
# numpy 1.26.4 dist-info next to the active numpy 2.0.2), so a raw export would be wrong.
# Runtime: Python 3.9.16, CUDA 12.4, cuDNN 9.1.0.
#
# Note on region-selection ties: the order of equal-area regions in `np.argsort(-count)`
# (datasets/custom.py) depends on the NumPy build; the paper's numbers correspond to numpy==2.0.2.
# The file previously shipped here (a 2023 export: numpy 1.24.2 / torch 1.12.1) is kept as
# environment_2023_export.yml for provenance only.
name: BBDM
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.9.16
  - pip
  - pip:
      - numpy==2.0.2
      - torch==2.5.1
      - torchvision==0.20.1
      - opencv-python==4.11.0.86
      - scikit-image==0.24.0
      - scipy==1.13.1
      - pillow==10.4.0
      - lpips==0.1.4
      - open_clip_torch==2.26.1
      - dreamsim==0.2.0
      - transformers==4.57.1
      - torchmetrics==1.4.0.post0
      - einops==0.4.1
      - omegaconf==2.3.0
      - pyyaml==6.0.2
      - tqdm==4.66.4
      # hint generation (same pins as hint_generation/requirements.txt)
      - fil_finder==1.7.2
      - astropy==4.3.1
      - networkx
      - natsort
      - matplotlib
