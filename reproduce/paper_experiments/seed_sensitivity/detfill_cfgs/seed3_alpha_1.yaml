# Brownian Bridge Diffusion Model Template(Pixel Space)
runner: "BBDMRunner"
training:
  n_epochs: 200
  n_steps: 400000
  save_interval: 10
  sample_interval: 1
  validation_interval: 1000
  accumulate_grad_batches: 2

testing:
  clip_denoised: True
  sample_num: 1

data:
  dataset_name: 'dataset_name'
  dataset_type: 'custom_train_our_model'
  dataset_config:
    dataset_path: '/scratch/madono/seedexp/detfill_roots/seed3_alpha_1'
    scratch_root: '/scratch/madono/seedexp/detfill_roots/seed3_alpha_1'
    hint_type: 'scribble'
    domain: "illust"
    image_size: 256
    # image_size: 64
    channels: 3
  train:
    batch_size: 1
    shuffle: True
  val:
    batch_size: 1
    shuffle: True
  test:
    batch_size: 5

    
result:
  sample_to_eval_path: "tog_results"

model:
  model_name: "BrownianBridge_scribble_illust" # part of result path
  model_type: "BBDM" # specify a module
  latent_before_quant_conv: False
  normalize_latent: False
  only_load_latent_mean_std: False

  EMA:
    use_ema: True
    ema_decay: 0.995
    update_ema_interval: 8 # step
    start_ema_step: 30000

  CondStageParams:
    n_stages: 2
    in_channels: 5
    out_channels: 5

  BB:
    optimizer:
      weight_decay: 0.000
      optimizer: 'Adam'
      lr: 1.e-4
      beta1: 0.9

    lr_scheduler:
      factor: 0.5
      patience: 3000
      threshold: 0.0001
      cooldown: 3000
      min_lr: 5.e-7

    params:
      mt_type: 'linear' # options {'linear', 'sin'}
      objective: 'grad' # options {'grad', 'noise', 'ysubx'}
      loss_type: 'l1' # options {'l1', 'l2'}

      skip_sample: True
      sample_type: 'linear' # options {"linear", "sin"}
      sample_step: 200

      num_timesteps: 1000 # timesteps
      eta: 1.0 # DDIM reverse process eta
      max_var: 1.0 # maximum variance          

      UNetParams:
        image_size: 256
        in_channels: 10
        # in_channels: 5
        model_channels: 64
        out_channels: 5
        num_res_blocks: 2
        attention_resolutions: !!python/tuple
          - 32
          - 16
          - 8         
        channel_mult: !!python/tuple
          - 1
          - 4
          - 8
        conv_resample: True
        dims: 2
        num_heads: 8
        num_head_channels: 64
        use_scale_shift_norm: True
        resblock_updown: True
        use_spatial_transformer: False
        context_dim:
        condition_key: "SpatialRescaler" # options {"SpatialRescaler", "first_stage", "nocond"}
        # condition_key: "first_stage" # options {"SpatialRescaler", "first_stage", "nocond"}                
        # condition_key: "nocond" # options {"SpatialRescaler", "first_stage", "nocond"}                
        # use_fp16: True
