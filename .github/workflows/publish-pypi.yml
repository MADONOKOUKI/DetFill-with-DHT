# Publish the `hintauc` package to PyPI with Trusted Publishing (no API token stored in the repository).
#
# Automatic rule: on every push to `main` that touches the library, the metadata or the README, the workflow reads the
# version in pyproject.toml; if that version is not on PyPI yet, it builds and publishes it. Pushing the same version
# again does nothing (PyPI never accepts re-uploads), so releasing = bump `version` in pyproject.toml and push.
# A tag `hintauc-v<version>` or a manual run also triggers it.
#
# One-time setup on PyPI (done): https://pypi.org/manage/account/publishing/ -> pending publisher
#   project hintauc, owner MADONOKOUKI, repository DetFill-with-DHT, workflow publish-pypi.yml, environment pypi
name: publish-pypi

on:
  push:
    branches: [main]
    paths: ["pyproject.toml", "hintauc/**", "docs/pypi_readme.md", "LICENSE", ".github/workflows/publish-pypi.yml"]
    tags: ["hintauc-v*"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: v
        shell: bash
        run: |
          python - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json, tomllib, urllib.request
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          try:
              released = json.load(urllib.request.urlopen("https://pypi.org/pypi/hintauc/json"))["releases"].keys()
          except Exception:
              released = []
          print(f"version={version}")
          print(f"publish={'false' if version in released else 'true'}")
          PY
      - run: echo "pyproject version ${{ steps.v.outputs.version }} -> publish=${{ steps.v.outputs.publish }}"

  build:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # The wheel that will be uploaded is installed into a fresh environment (outside the checkout, so nothing is
  # imported from the source tree) and must pass the library tests, the demo and the CPU quick start, with and
  # without PyTorch, before it is published.
  test-wheel:
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - python-version: "3.9"
            torch: "no"
          - python-version: "3.12"
            torch: "no"
          - python-version: "3.11"
            torch: "yes"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: python -m pip install --upgrade pip
      - if: matrix.torch == 'yes'
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && python -m pip install "torchmetrics==1.4.0" matplotlib
      - name: install the wheel and check the import comes from site-packages
        run: |
          python -m pip install dist/*.whl pytest
          cd /tmp && python -c "import hintauc, os; assert 'site-packages' in hintauc.__file__, hintauc.__file__; print(hintauc.__version__, hintauc.__file__)"
      - name: library tests against the installed wheel
        run: |
          mkdir -p /tmp/wheeltests && cp -r tests /tmp/wheeltests/ && cd /tmp/wheeltests && pytest tests -q -k "not detfill"
      - name: demo and quick start against the installed wheel
        run: |
          cd /tmp && hintauc demo --out /tmp/demo && python "$GITHUB_WORKSPACE/examples/check_expected.py" /tmp/demo/result.json demo
          python "$GITHUB_WORKSPACE/examples/quickstart_cpu.py" --fast --out /tmp/quickstart && python "$GITHUB_WORKSPACE/examples/check_expected.py" /tmp/quickstart/result.json quickstart_fast

  publish:
    needs: [check, build, test-wheel]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
