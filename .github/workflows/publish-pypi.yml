# Publish the `hintauc` package to PyPI with Trusted Publishing (no API token stored in the repository).
#
# Automatic rule: on every push to `main` that touches the library, the metadata or the README, the workflow reads the
# version in pyproject.toml; if that version is not on PyPI yet, it builds and publishes it. Pushing the same version
# again does nothing (PyPI never accepts re-uploads), so releasing = bump `version` in pyproject.toml and push.
# A tag `hintauc-v<version>` or a manual run also triggers it.
#
# One-time setup on PyPI (done): https://pypi.org/manage/account/publishing/ -> pending publisher
#   project hintauc, owner MADONOKOUKI, repository DetFill-with-DHT, workflow publish-pypi.yml, environment pypi
name: publish-pypi

on:
  push:
    branches: [main]
    paths: ["pyproject.toml", "hintauc/**", "README.md", "LICENSE", ".github/workflows/publish-pypi.yml"]
    tags: ["hintauc-v*"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: v
        shell: bash
        run: |
          python - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json, tomllib, urllib.request
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          try:
              released = json.load(urllib.request.urlopen("https://pypi.org/pypi/hintauc/json"))["releases"].keys()
          except Exception:
              released = []
          print(f"version={version}")
          print(f"publish={'false' if version in released else 'true'}")
          PY
      - run: echo "pyproject version ${{ steps.v.outputs.version }} -> publish=${{ steps.v.outputs.publish }}"

  build:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
