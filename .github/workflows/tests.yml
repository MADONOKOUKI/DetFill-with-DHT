# Continuous tests (free for public repositories on GitHub-hosted runners).
# library: the hintauc package alone (no PyTorch), on three Python versions.
# full:    hintauc + PyTorch (CPU wheels) — perceptual-metric registry checks and the DetFill data loader.
name: tests

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "assets/**", "CITATION.cff"]
  pull_request:
    paths-ignore: ["docs/**", "**.md", "assets/**", "CITATION.cff"]
  workflow_dispatch:

jobs:
  library:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - run: python -c "import hintauc; print(hintauc.__version__)" && hintauc --help > /dev/null
      - run: pytest tests -q -k "not detfill"
      - name: shell scripts parse (one bash -n per file; a single call only checks the first argument)
        run: |
          for f in replicability/run.sh replicability/conda_env.sh replicability/fetch_checkpoints.sh reproduce/examples/run_examples.sh reproduce/scripts/*.sh detfill/*.sh; do
            bash -n "$f" || exit 1
          done
      - name: demo and CPU quick start without PyTorch (Pillow backend; numbers must match the recorded ones)
        run: |
          hintauc demo --out /tmp/demo
          python examples/quickstart_cpu.py --fast --out /tmp/quickstart
          python examples/check_expected.py /tmp/demo/result.json demo && python examples/check_expected.py /tmp/quickstart/result.json quickstart_fast

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . pytest "torchmetrics==1.4.0" matplotlib tensorboard tqdm pyyaml
      - run: pytest tests -q
      - name: demo and CPU quick start with PyTorch (torchvision + torchmetrics backend; numbers must match the recorded ones)
        run: |
          hintauc demo --out /tmp/demo
          python examples/quickstart_cpu.py --fast --out /tmp/quickstart && test -s /tmp/quickstart/curve.png
          python examples/check_expected.py /tmp/demo/result.json demo && python examples/check_expected.py /tmp/quickstart/result.json quickstart_fast
